name: PHPUnit tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master, 2.5.x]
    paths:
      - "**/*.php"
      - "composer.json"
      - "composer.lock"
      - "phpunit.xml.dist"
      - ".github/workflows/pr-phpunit-tests.yml"
      - ".github/actions/prepare-php-environment/action.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  phpunit-tests:
    name: PHPUnit Tests - PHP v${{ matrix.php }} - illuminate v${{ matrix.illuminate }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ !(github.event.pull_request.draft || startsWith(github.head_ref, 'code-style-fix/')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '7.3'
            illuminate: '8'
          - php: '7.4'
            illuminate: '8'
          - php: '8.0'
            illuminate: '8'
          - php: '8.0'
            illuminate: '9'
          - php: '8.1'
            illuminate: '8'
          - php: '8.1'
            illuminate: '9'
          - php: '8.1'
            illuminate: '10'
          - php: '8.2'
            illuminate: '9'
          - php: '8.2'
            illuminate: '10'
          - php: '8.2'
            illuminate: '11'
          - php: '8.2'
            illuminate: '12'
          - php: '8.3'
            illuminate: '10'
          - php: '8.3'
            illuminate: '11'
          - php: '8.3'
            illuminate: '12'
          - php: '8.3'
            illuminate: '13'
          - php: '8.4'
            illuminate: '11'
          - php: '8.4'
            illuminate: '12'
          - php: '8.4'
            illuminate: '13'
          - php: '8.5'
            illuminate: '12'
          - php: '8.5'
            illuminate: '13'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Prepare PHP Environment - PHP v${{ matrix.php }}
        uses: ./.github/actions/prepare-php-environment/
        with:
          PHP_VERSION: ${{ matrix.php }}


      - name: Resolve composer dependencies for PHP v${{ matrix.php }} / illuminate v${{ matrix.illuminate }}
        run: >
          composer update --no-interaction --prefer-dist --with-all-dependencies
          --with "illuminate/console:${{ matrix.illuminate }}"
          --with "illuminate/database:${{ matrix.illuminate }}"
          --with "illuminate/support:${{ matrix.illuminate }}"
          --with "orchestra/testbench:${{ matrix.testbench }}"
          --with "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Unit Tests - PHP v${{ matrix.php }} / illuminate v${{ matrix.illuminate }}
        run: |
          php ./vendor/bin/phpunit --colors="always"
